server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # nginx's bundled mime.types has no mapping for .mjs, so ES modules would be
    # served as application/octet-stream and the browser refuses to execute them.
    location ~ \.mjs$ {
        default_type text/javascript;
    }
}
