services:
  db:
    image: postgres:17.4
    env_file: backend/.env
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      POSTGRES_HOST: db
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./front-end
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pg_data:
